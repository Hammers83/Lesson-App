<!-- CHAT COMMUNITY & PRIVATA -->
<div class="glass-panel p-6 rounded-3xl space-y-4">
    <div class="flex justify-between items-center border-b border-brand-border pb-3">
        <h3 class="text-lg font-black uppercase text-white flex items-center gap-2">
            <i class="fa-solid fa-comments text-brand-cyan"></i> Community &amp; Chat
        </h3>
        <!-- Selettore Canale Chat -->
        <select id="chat-type-select" class="bg-brand-dark border border-brand-border text-white text-xs rounded-xl p-2 font-bold focus:outline-none focus:border-brand-cyan">
            <option value="group">📢 Chat di Gruppo</option>
            <option value="private">🔒 Messaggio Privato Istruttore</option>
        </select>
    </div>

    <!-- Contenitore e Select per la scelta dell'allieva (Visibile solo in modalità Privata) -->
    <div id="student-selector-wrapper" class="hidden">
        <label for="student-private-select" class="block text-xs font-bold text-gray-400 uppercase mb-1">
            Seleziona Allieva:
        </label>
        <select id="student-private-select" class="w-full bg-brand-dark border border-brand-border text-white text-xs rounded-xl p-2.5 font-bold focus:outline-none focus:border-brand-cyan">
            <option value="">-- Seleziona un'allieva --</option>
        </select>
    </div>

    <!-- Area Messaggi -->
    <div id="chat-messages-container" class="h-64 overflow-y-auto space-y-3 p-3 bg-brand-dark/50 rounded-2xl border border-brand-border">
        <!-- Messaggi popolati da chat.js -->
    </div>

    <!-- Form Invio -->
    <form id="chat-form" class="flex gap-2">
        <label for="chat-input" class="sr-only">Scrivi un messaggio</label>
        <input type="text" id="chat-input" placeholder="Scrivi un messaggio..." required autocomplete="off"
            class="flex-grow bg-brand-dark border border-brand-border rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-brand-cyan">
        <button type="submit" class="btn-gradient text-black font-black px-5 py-2.5 rounded-xl text-xs uppercase hover:opacity-90 transition">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </form>
</div>
