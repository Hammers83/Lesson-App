<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Zone - Accesso</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0f172a',
                            panel: '#1e293b',
                            border: '#334155',
                            cyan: '#06b6d4',
                            lime: '#84cc16',
                            pink: '#ec4899'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .fitness-text-gradient {
            background: linear-gradient(135deg, #06b6d4 0%, #84cc16 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #06b6d4 0%, #84cc16 100%);
        }
    </style>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- HEADER / NAVBAR -->
    <header class="py-6 px-4 text-center border-b border-brand-border/40">
        <h1 class="text-2xl font-black uppercase tracking-widest text-white">
            Workout <span class="fitness-text-gradient">Zone</span>
        </h1>
    </header>

    <!-- FORM DI ACCESSO / REGISTRAZIONE -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="max-w-md w-full glass-panel p-6 sm:p-8 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="text-center mb-6">
                <h2 class="text-3xl font-black uppercase tracking-tight text-white">
                    Workout <span class="fitness-text-gradient">Zone</span>
                </h2>
                <p id="auth-subtitle" class="text-xs text-gray-400 mt-1">Accedi per gestire le tue lezioni</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <!-- CAMPI DINAMICI GENERATI DA JAVASCRIPT -->
                <div id="form-fields-container" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Email</label>
                        <input type="email" id="auth-email" required class="w-full px-4 py-3 bg-brand-dark border border-brand-border rounded-xl text-white text-sm focus:outline-none focus:border-brand-cyan">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Password</label>
                        <input type="password" id="auth-password" required class="w-full px-4 py-3 bg-brand-dark border border-brand-border rounded-xl text-white text-sm focus:outline-none focus:border-brand-cyan">
                    </div>
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full py-3.5 btn-gradient text-black font-black uppercase tracking-wider text-sm rounded-xl shadow-lg hover:opacity-95 transition active:scale-95">
                    Entra
                </button>
            </form>

            <div class="mt-6 text-center pt-4 border-t border-brand-border">
                <p id="auth-switch-text" class="text-xs text-gray-400">
                    Non hai un account? 
                    <button type="button" id="btn-toggle-auth" class="text-brand-lime font-bold hover:underline ml-1">Registrati</button>
                </p>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-4 text-center text-xs text-gray-500 border-t border-brand-border/40">
        &copy; Workout Zone. Tutti i diritti riservati.
    </footer>

    <!-- SCRIPT APPLICATION -->
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
